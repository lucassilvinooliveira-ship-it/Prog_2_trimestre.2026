<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game do saber</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #000000;
            line-height: 1.6;
        }

        
        header {
            background-color: #1a1a1a;
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid #170a88;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .car-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 2.5rem;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .car-card:hover {
            transform: translateY(-5px);
        }

        .car-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .car-info {
            padding: 1.5rem;
        }

        .car-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #ff4154;
        }

        .car-info p {
            margin-bottom: 1rem;
            color: #ccc;
        }

        .specs-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            background-color: #222;
            padding: 1rem;
            border-radius: 5px;
        }

        .specs-list li {
            font-size: 0.9rem;
            color: #ddd;
        }

        .specs-list li strong {
            color: #ff4154;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #1a1a1a;
            color: #777;
        }

        @media (max-width: 768px) {
            .car-image {
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Lendas Automotivas</h1>
        <p>Desempenho, design e velocidade</p>
    </header>

    <div class="container">
